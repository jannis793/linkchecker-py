name: Link check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linkchecker-py from GitHub
        run: python -m pip install "git+https://github.com/jannis793/linkchecker-py.git@v0.1.1"
      - name: Check documentation links
        run: linkchecker-py files README.md docs/ --report link-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-report
          path: link-report.md
