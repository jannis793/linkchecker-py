name: Bug report
description: Report a reproducible problem with linkchecker-py.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, sample file or URL, and output.
      value: |
        ```bash
        linkchecker-py files README.md
        ```
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: linkchecker-py 0.1.0, Python 3.12
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell, and any relevant CI details.
