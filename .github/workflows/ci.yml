name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Check package metadata
        if: matrix.python-version == '3.12'
        run: python -m twine check dist/*

  self-check-links:
    name: Dogfood linkchecker-py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Check repository docs links
        run: |
          linkchecker-py files README.md docs/ examples/ \
            --exclude "https://*" \
            --exclude "http://*" \
            --exclude "missing.md" \
            --report linkchecker-self-check.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkchecker-self-check
          path: linkchecker-self-check.md
