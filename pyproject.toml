[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkchecker-py"
version = "0.1.0"
description = "Fast async broken-link checker for Markdown, HTML, and websites."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "linkchecker-py maintainers" }]
keywords = ["links", "markdown", "html", "crawler", "cli", "broken-links"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "platformdirs>=4.2",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
linkchecker-py = "linkchecker_py.cli:app"

[project.urls]
Homepage = "https://github.com/jannis793/linkchecker-py"
Issues = "https://github.com/jannis793/linkchecker-py/issues"
Source = "https://github.com/jannis793/linkchecker-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
